<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>VideoDock 設定</title>
<meta name="color-scheme" content="light dark">
<style>
  body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  fieldset { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 10px; margin: 16px 0; padding: 8px 16px 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; padding: 3px 0; }
  .sub { opacity: .7; font-size: 12px; margin-left: 22px; }
  input[type=number] { width: 80px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  button { padding: 6px 14px; }
  #status { margin-left: 12px; opacity: .8; }
</style>
</head>
<body>
<h1>VideoDock 設定</h1>

<fieldset>
  <legend>PiPウィンドウの操作バーの出し方</legend>
  <label><input type="radio" name="uiMode" value="edge"> 下端に近づいたときだけ表示 <span class="sub">（既定）</span></label>
  <label><input type="radio" name="uiMode" value="move"> マウスを動かすたびに表示</label>
  <label><input type="radio" name="uiMode" value="always"> 常に表示</label>
  <label><input type="radio" name="uiMode" value="hidden"> 表示しない <span class="sub">PiP窓で <kbd>H</kbd> キーを押すと出し入れできます</span></label>
  <div class="row">下端の反応範囲 <input type="number" id="edgeSize" min="16" max="300" step="4"> px</div>
  <div class="row">操作が止まってから隠すまで <input type="number" id="hideDelay" min="200" max="10000" step="100"> ms</div>
  <label><input type="checkbox" id="showHint"> PiPを開いたとき、操作ヒントを数秒表示する</label>
</fieldset>

<fieldset>
  <legend>PiPウィンドウのホイール操作</legend>
  <div class="sub" style="margin-left:0">右クリックを押しながらホイール = ズーム（カーソル位置が中心）。窓の上部・下部でのホイールは次の割り当てです。中央部は何もしません。</div>
  <label><input type="radio" name="wheelSwap" value="0"> 上部 = 音量 / 下部 = シーク <span class="sub">（既定）</span></label>
  <label><input type="radio" name="wheelSwap" value="1"> 上部 = シーク / 下部 = 音量</label>
  <div class="row">上部・下部の範囲 <input type="number" id="wheelZone" min="10" max="45" step="5"> %（窓の高さに対して）</div>
  <label><input type="checkbox" id="wheelInvert"> 音量・シークのホイール向きを反転 <span class="sub">既定: 上 = 音量UP / 進む</span></label>
  <label><input type="checkbox" id="zoomInvert"> ズームのホイール向きを反転 <span class="sub">既定: 上 = 拡大</span></label>
  <div class="row">音量: 1ノッチあたり <input type="number" id="volumeStep" min="1" max="25" step="1"> %</div>
  <div class="row">シーク: 1ノッチあたり <input type="number" id="seekStep" min="1" max="120" step="1"> 秒</div>
</fieldset>

<fieldset>
  <legend>表示するボタン</legend>
  <div class="grid">
    <label><input type="checkbox" data-btn="play"> 再生 / 一時停止</label>
    <label><input type="checkbox" data-btn="seek"> シークバー</label>
    <label><input type="checkbox" data-btn="time"> 時間表示</label>
    <label><input type="checkbox" data-btn="mute"> ミュート</label>
    <label><input type="checkbox" data-btn="zoom"> ズーム (− 100% ＋)</label>
    <label><input type="checkbox" data-btn="back"> タブに戻す</label>
  </div>
  <div class="sub" style="margin-left:0">ボタンを隠しても、キー操作（Space / ← → / + − 0 / M / F / H）は使えます。</div>
</fieldset>

<button id="reset">既定に戻す</button><span id="status" role="status"></span>
<script src="defaults.js"></script>
<script src="options.js"></script>
</body>
</html>
